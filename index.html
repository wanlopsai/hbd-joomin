<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday น้องจูมิน 🎂</title>
    <!-- นำเข้าฟอนต์ลายมือภาษาไทย Mali และ Itim จาก Google Fonts เพื่อให้แสดงผลเป็นลายมือบนทุกอุปกรณ์ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* รีเซ็ตค่าพื้นฐานและการตั้งค่าหน้าจอ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Mali', 'Itim', cursive, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* พื้นหลังโทนพาสเทลละมุนตา (ครีม - ชมพูอ่อน - พีชพาสเทล) */
            background: linear-gradient(135deg, #FFF9F2 0%, #FFE6EE 48%, #FFD9CE 100%);
            color: #5D3A3A; /* สีน้ำตาลช็อกโกแลตเข้มอบอุ่น อ่านง่ายชัดเจน */
            /* บังคับใช้ฟอนต์ลายมือภาษาไทย Mali และ Itim */
            font-family: 'Mali', 'Itim', cursive, sans-serif;
            overflow: hidden; /* ป้องกัน scrollbar ส่วนเกิน */
            user-select: none;
            -webkit-user-select: none;
        }

        /* กำหนดให้ปุ่มต่างๆ ใช้ฟอนต์ลายมือเดียวกับทั้งหน้าเว็บ */
        button {
            font-family: 'Mali', 'Itim', cursive, sans-serif;
        }

        /* ลวดลายจุด Polka dot และแสงฟุ้งน่ารักๆ ด้านหลัง */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(rgba(255, 143, 171, 0.22) 2px, transparent 2px),
                radial-gradient(rgba(255, 183, 130, 0.22) 2px, transparent 2px);
            background-size: 44px 44px;
            background-position: 0 0, 22px 22px;
            pointer-events: none;
            z-index: 1;
        }

        /* แคนวาสสำหรับลวดลายตกแต่งลอยเบาๆ (หัวใจ ดาว ประกายแสง) และพลุกระดาษ */
        #celebration-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* คอนเทนเนอร์หลักจัดกึ่งกลางทั้งแนวตั้งและแนวนอน */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
            gap: 18px;
        }

        /* ปุ่มควบคุมเสียงมุมขวาบน */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.72);
            border: 1.5px solid rgba(255, 138, 168, 0.45);
            color: #7A444B;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(235, 130, 155, 0.18);
        }

        .audio-control.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .audio-control:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.06);
        }

        .audio-control:active {
            transform: scale(0.95);
        }

        .audio-control svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* กราฟิก SVG เค้กวันเกิดสไตล์น่ารักพร้อมเปลวไฟดุ๊กดิ๊ก */
        .cake-wrapper {
            width: clamp(135px, 34vw, 185px);
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 10px 18px rgba(226, 125, 145, 0.25));
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
            animation: cakeFloat 3.6s ease-in-out infinite;
        }

        /* ย่อขนาดเค้กลงเล็กน้อยระหว่างแสดงข้อความ เพื่อไม่ให้แย่งความสนใจและไม่บังตัวหนังสือ */
        .cake-wrapper.compact {
            width: clamp(105px, 24vw, 135px);
            margin-top: 6px;
        }

        @keyframes cakeFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* แอนิเมชันเปลวไฟเทียนดุ๊กดิ๊ก */
        .candle-flame {
            transform-origin: center bottom;
            transform-box: fill-box;
            animation: flameWiggle 1.1s ease-in-out infinite alternate;
        }

        .candle-glow {
            transform-origin: center center;
            transform-box: fill-box;
            animation: glowPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes flameWiggle {
            0% {
                transform: rotate(-5deg) scale(0.96, 1.03);
            }
            50% {
                transform: rotate(4deg) scale(1.04, 0.97);
            }
            100% {
                transform: rotate(-3deg) scale(0.98, 1.05);
            }
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.45;
                transform: scale(0.92);
            }
            100% {
                opacity: 0.85;
                transform: scale(1.12);
            }
        }

        /* หน้าแรก: ปุ่มแตะเพื่อเริ่ม */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        .start-button {
            padding: 16px 42px;
            font-size: clamp(1.25rem, 4.6vw, 1.5rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.6;
            color: #FFFFFF;
            background: linear-gradient(135deg, #FF8FA3 0%, #FF758F 100%);
            border: 2px solid #FFFFFF;
            border-radius: 50px;
            cursor: pointer;
            animation: gentlePulse 2.4s infinite ease-in-out;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 22px rgba(255, 117, 143, 0.35);
        }

        .start-button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 26px rgba(255, 117, 143, 0.48);
        }

        .start-button:active {
            transform: scale(0.96);
        }

        @keyframes gentlePulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 20px rgba(255, 117, 143, 0.32);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 10px 28px rgba(255, 117, 143, 0.52);
            }
        }

        /* พื้นที่แสดงข้อความทีละบรรทัด พร้อมกรอบฟุ้งนุ่มๆ ให้อ่านง่ายชัดเจน */
        .message-box {
            max-width: 92%;
            width: 680px;
            min-height: 115px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 26px;
            background: rgba(255, 255, 255, 0.58);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 28px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(226, 134, 152, 0.14);
        }

        .message-text {
            font-size: clamp(1.5rem, 5.6vw, 2.4rem);
            font-weight: 600;
            line-height: 1.85;
            letter-spacing: 0.4px;
            color: #5A353A;
            opacity: 0;
            transform: translateY(12px) rotate(-0.6deg);
            transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
            word-break: keep-all;
        }

        .message-text.show {
            opacity: 1;
            transform: translateY(0) rotate(0deg);
        }

        .message-text.hide {
            opacity: 0;
            transform: translateY(-12px) rotate(0.6deg);
        }

        /* ส่วนท้าย (Ending Screen) */
        .ending-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1.4s ease, transform 1.4s ease;
            padding: 26px 30px;
            background: rgba(255, 255, 255, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 32px rgba(235, 130, 155, 0.18);
            max-width: 92%;
        }

        .ending-screen.active {
            display: flex;
        }

        .ending-screen.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .ending-title {
            font-size: clamp(1.7rem, 6.2vw, 2.6rem);
            font-weight: 700;
            line-height: 1.75;
            letter-spacing: 0.4px;
            color: #6B3641;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .replay-button {
            padding: 13px 34px;
            font-size: clamp(1.1rem, 4vw, 1.25rem);
            font-weight: 600;
            line-height: 1.6;
            color: #7A444B;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(255, 143, 163, 0.55);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(235, 130, 155, 0.15);
        }

        .replay-button:hover {
            background: #FF8FA3;
            color: #FFFFFF;
            border-color: #FF8FA3;
            transform: translateY(-2px);
        }

        .replay-button:active {
            transform: translateY(0) scale(0.97);
        }
    </style>
</head>
<body>

    <!-- แคนวาสสำหรับลวดลายน่ารักๆ ลอยเบาๆ และพลุกระดาษตอนจบ -->
    <canvas id="celebration-canvas"></canvas>

    <!-- ไฟล์เสียงเพลงพื้นหลัง every_year.mp3 จาก GitHub Repository (wanlopsai/hbd-joomin) -->
    <audio id="bg-music" loop preload="auto">
        <source src="every_year.mp3" type="audio/mpeg">
        <source src="https://raw.githubusercontent.com/wanlopsai/hbd-joomin/main/every_year.mp3" type="audio/mpeg">
    </audio>

    <!-- ปุ่มเปิด/ปิดเสียงมุมขวาบน -->
    <button id="audio-toggle" class="audio-control" aria-label="เปิดหรือปิดเสียงเพลง" title="เปิด/ปิดเสียงเพลง">
        <!-- ไอคอนลำโพงเปิดเสียง -->
        <svg id="icon-sound-on" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <!-- ไอคอนลำโพงปิดเสียง -->
        <svg id="icon-sound-off" viewBox="0 0 24 24" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <!-- พื้นที่หลักกึ่งกลางหน้าจอ -->
    <main class="app-container" id="main-area">
        <!-- รูปเค้กวันเกิดสตรอว์เบอร์รีพาสเทลสุดน่ารัก พร้อมเปลวไฟเทียนดุ๊กดิ๊ก -->
        <div id="cake-display" class="cake-wrapper" aria-hidden="true">
            <svg viewBox="0 0 220 210" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <!-- แสงฟุ้งรอบเปลวไฟ -->
                <circle class="candle-glow" cx="110" cy="34" r="22" fill="#FFE066" opacity="0.65" />

                <!-- เปลวไฟเทียนขยับดุ๊กดิ๊กได้ -->
                <g class="candle-flame">
                    <path d="M110 16 C118 28, 120 38, 110 43 C100 38, 102 28, 110 16 Z" fill="#FF9F1C" />
                    <path d="M110 23 C114 30, 115 36, 110 39 C105 36, 106 30, 110 23 Z" fill="#FFF3B0" />
                </g>

                <!-- ไส้เทียน -->
                <line x1="110" y1="42" x2="110" y2="48" stroke="#5A353A" stroke-width="2.5" stroke-linecap="round" />

                <!-- แท่งเทียนลายทางพาสเทล -->
                <rect x="103" y="48" width="14" height="34" rx="4" fill="#FFFDF9" stroke="#F4978E" stroke-width="1.5" />
                <path d="M103 57 L117 53 M103 66 L117 62 M103 75 L117 71" stroke="#FF8FA3" stroke-width="3" stroke-linecap="round" />

                <!-- จานรองเค้กสีครีมขอบทองพาสเทล -->
                <ellipse cx="110" cy="182" rx="92" ry="15" fill="#FFFDFB" stroke="#F3C6CF" stroke-width="2.5" />
                <ellipse cx="110" cy="180" rx="78" ry="10" fill="#FFEFF3" />

                <!-- ตัวเค้กชั้นล่าง (สปันจ์วานิลลาชมพูอ่อน) -->
                <rect x="38" y="128" width="144" height="50" rx="16" fill="#FFD6E0" stroke="#F29CB0" stroke-width="2" />
                <!-- ครีมหยดย้อยชั้นล่าง -->
                <path d="M38 138 Q48 152 58 140 Q68 154 78 140 Q88 155 98 140 Q110 156 122 140 Q132 154 142 140 Q152 154 162 140 Q172 152 182 138 L182 132 Q182 124 170 124 L50 124 Q38 124 38 132 Z" fill="#FFFDF9" />
                <!-- สตรอว์เบอร์รีจิ๋วประดับขอบชั้นล่าง -->
                <circle cx="64" cy="162" r="4.5" fill="#FF6B8B" />
                <circle cx="110" cy="164" r="4.5" fill="#FF6B8B" />
                <circle cx="156" cy="162" r="4.5" fill="#FF6B8B" />

                <!-- ตัวเค้กชั้นบน (เค้กครีมสตรอว์เบอร์รี) -->
                <rect x="56" y="82" width="108" height="46" rx="15" fill="#FFC2D1" stroke="#EE8BA3" stroke-width="2" />
                <!-- ครีมขาวนุ่มฟูด้านบนสุด -->
                <path d="M56 94 Q66 108 76 95 Q88 110 100 95 Q110 110 120 95 Q132 110 144 95 Q154 108 164 94 L164 88 Q164 78 150 78 L70 78 Q56 78 56 88 Z" fill="#FFFFFF" />

                <!-- ลูกสตรอว์เบอร์รีน่ารักๆ บนยอดเค้ก -->
                <!-- ลูกซ้าย -->
                <g transform="translate(82, 74)">
                    <path d="M0 -8 C7 -8, 10 0, 0 9 C-10 0, -7 -8, 0 -8 Z" fill="#FF5C8A" />
                    <path d="M-5 -8 Q0 -4 5 -8 Q2 -11 0 -9 Q-2 -11 -5 -8 Z" fill="#70E000" />
                    <circle cx="-2" cy="-2" r="0.8" fill="#FFF3B0" />
                    <circle cx="2" cy="1" r="0.8" fill="#FFF3B0" />
                </g>
                <!-- ลูกขวา -->
                <g transform="translate(138, 74)">
                    <path d="M0 -8 C7 -8, 10 0, 0 9 C-10 0, -7 -8, 0 -8 Z" fill="#FF5C8A" />
                    <path d="M-5 -8 Q0 -4 5 -8 Q2 -11 0 -9 Q-2 -11 -5 -8 Z" fill="#70E000" />
                    <circle cx="-2" cy="-2" r="0.8" fill="#FFF3B0" />
                    <circle cx="2" cy="1" r="0.8" fill="#FFF3B0" />
                </g>

                <!-- หน้าตายิ้มคาวาอี้บนตัวเค้กชั้นบน -->
                <circle cx="96" cy="112" r="2.6" fill="#5A353A" />
                <circle cx="124" cy="112" r="2.6" fill="#5A353A" />
                <!-- แก้มชมพูระเรื่อ -->
                <ellipse cx="88" cy="116" rx="4.5" ry="2.5" fill="#FF8FA3" opacity="0.7" />
                <ellipse cx="132" cy="116" rx="4.5" ry="2.5" fill="#FF8FA3" opacity="0.7" />
                <!-- ปากยิ้มเล็กๆ -->
                <path d="M106 114 Q110 119 114 114" fill="none" stroke="#5A353A" stroke-width="2.2" stroke-linecap="round" />

                <!-- เม็ดน้ำตาลตกแต่งสีพาสเทล (Sprinkles) -->
                <rect x="74" y="84" width="5" height="2.2" rx="1" transform="rotate(25 74 84)" fill="#FFD166" />
                <rect x="122" y="83" width="5" height="2.2" rx="1" transform="rotate(-20 122 83)" fill="#9BF6FF" />
                <rect x="108" y="86" width="5" height="2.2" rx="1" transform="rotate(15 108 86)" fill="#BDB2FF" />
            </svg>
        </div>

        <!-- หน้าแรก: แตะเพื่อเริ่ม -->
        <div id="start-screen" class="start-screen">
            <button id="start-btn" class="start-button">แตะเพื่อเริ่ม 💖</button>
        </div>

        <!-- กล่องแสดงข้อความอวยพรทีละบรรทัด -->
        <div id="message-box" class="message-box" style="display: none;">
            <p id="message-text" class="message-text"></p>
        </div>

        <!-- หน้าจอปิดท้าย -->
        <div id="ending-screen" class="ending-screen">
            <h1 class="ending-title">สุขสันต์วันเกิด 17 ปีนะคะ น้องจูมิน 🎂🎉💖✨</h1>
            <button id="replay-btn" class="replay-button">ดูอีกครั้ง 🔄</button>
        </div>
    </main>

    <script>
        /**
         * ระบบควบคุมการเล่นไฟล์เพลง MP3 (every_year.mp3) จาก GitHub
         * รองรับการปลดล็อกเสียงบนมือถือ (iOS / Android) เมื่อผู้ใช้แตะหน้าจอเริ่มต้น
         */
        class Mp3BackgroundPlayer {
            constructor(audioElement) {
                this.audio = audioElement;
                this.isMuted = false;
                if (this.audio) {
                    this.audio.volume = 0.7;
                }
            }

            start() {
                if (!this.audio) return;
                this.audio.volume = 0.7;
                this.audio.muted = this.isMuted;

                const playPromise = this.audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch((error) => {
                        console.warn('ไม่สามารถเล่นไฟล์เสียงอัตโนมัติได้:', error);
                    });
                }
            }

            ensurePlaying() {
                if (!this.audio) return;
                if (this.audio.paused && !this.isMuted) {
                    this.audio.play().catch(() => {});
                }
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.audio) {
                    this.audio.muted = this.isMuted;
                    if (!this.isMuted && this.audio.paused) {
                        this.audio.play().catch(() => {});
                    }
                }
                return this.isMuted;
            }
        }

        /**
         * ระบบลวดลายตกแต่งน่ารักๆ ลอยเบาๆ ตลอดเวลา (หัวใจดวงเล็ก ดาววิบวับ ประกายแสง)
         * และเพิ่มพลุกระดาษพาสเทลโปรยปรายในช่วงฉากจบ
         */
        class CuteBackgroundEffect {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.ambientParticles = [];
                this.confettiParticles = [];
                this.isCelebrationMode = false;

                // โทนสีพาสเทลน่ารักสดใสสำหรับลวดลายตกแต่ง
                this.cuteColors = [
                    '#FF8FA3', // ชมพูสตรอว์เบอร์รี
                    '#FFB3C6', // ชมพูพาสเทล
                    '#FFC8DD', // ชมพูอ่อนละมุน
                    '#FFAFCC', // ชมพูพีช
                    '#FFD166', // เหลืองทองพาสเทล
                    '#BDB2FF', // ม่วงลาเวนเดอร์
                    '#A0C4FF', // ฟ้าพาสเทล
                    '#FFADAD'  // พีชอ่อน
                ];

                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initAmbient();
                this.loop();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            // สร้างหัวใจและดาววิบวับลอยเบาๆ ด้านหลังตั้งแต่เปิดหน้าเว็บ
            initAmbient() {
                const count = Math.min(34, Math.max(18, Math.floor((this.canvas.width * this.canvas.height) / 26000)));
                this.ambientParticles = [];
                for (let i = 0; i < count; i++) {
                    this.ambientParticles.push(this.createAmbientItem(true));
                }
            }

            createAmbientItem(randomY = false) {
                const types = ['heart', 'sparkle', 'circle'];
                const type = types[Math.floor(Math.random() * types.length)];
                const color = this.cuteColors[Math.floor(Math.random() * this.cuteColors.length)];

                return {
                    type: type,
                    x: Math.random() * this.canvas.width,
                    y: randomY ? Math.random() * this.canvas.height : this.canvas.height + 20,
                    size: type === 'heart' ? (Math.random() * 6 + 6) : (Math.random() * 4 + 3),
                    color: color,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: -(Math.random() * 0.45 + 0.2), // ลอยขึ้นช้าๆ นุ่มนวล
                    rotation: (Math.random() - 0.5) * 0.4,
                    swayPhase: Math.random() * Math.PI * 2,
                    alpha: Math.random() * 0.35 + 0.25
                };
            }

            // เปิดโหมดฉลองตอนจบ: เพิ่มพลุกระดาษพาสเทลโปรยลงมา
            startCelebration() {
                if (this.isCelebrationMode) return;
                this.isCelebrationMode = true;
                this.confettiParticles = [];

                const count = Math.min(75, Math.floor((this.canvas.width * this.canvas.height) / 11000));
                for (let i = 0; i < count; i++) {
                    this.confettiParticles.push(this.createConfettiItem(true));
                }
            }

            stopCelebration() {
                this.isCelebrationMode = false;
                this.confettiParticles = [];
            }

            createConfettiItem(randomY = false) {
                const color = this.cuteColors[Math.floor(Math.random() * this.cuteColors.length)];
                return {
                    x: Math.random() * this.canvas.width,
                    y: randomY ? Math.random() * this.canvas.height : -15,
                    size: Math.random() * 6 + 4.5,
                    color: color,
                    vx: (Math.random() - 0.5) * 0.9,
                    vy: Math.random() * 1.2 + 0.6,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.05,
                    wobble: Math.random() * Math.PI * 2,
                    alpha: Math.random() * 0.4 + 0.55
                };
            }

            drawHeart(ctx, size) {
                ctx.beginPath();
                const topCurveHeight = size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
                ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.4, 0, size);
                ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
                ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();
                ctx.fill();
            }

            drawSparkle(ctx, r) {
                ctx.beginPath();
                ctx.moveTo(0, -r * 1.6);
                ctx.quadraticCurveTo(0, 0, r * 1.6, 0);
                ctx.quadraticCurveTo(0, 0, 0, r * 1.6);
                ctx.quadraticCurveTo(0, 0, -r * 1.6, 0);
                ctx.quadraticCurveTo(0, 0, 0, -r * 1.6);
                ctx.fill();
            }

            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 1. วาดลวดลายหัวใจและดาวลอยเบาๆ ด้านหลัง
                for (let i = 0; i < this.ambientParticles.length; i++) {
                    const p = this.ambientParticles[i];
                    p.swayPhase += 0.02;
                    p.x += p.vx + Math.sin(p.swayPhase) * 0.25;
                    p.y += p.vy;

                    if (p.y < -25) {
                        this.ambientParticles[i] = this.createAmbientItem(false);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate(p.rotation + Math.sin(p.swayPhase) * 0.12);
                    this.ctx.globalAlpha = p.alpha * (0.8 + 0.2 * Math.sin(p.swayPhase * 1.5));
                    this.ctx.fillStyle = p.color;

                    if (p.type === 'heart') {
                        this.drawHeart(this.ctx, p.size * 1.5);
                    } else if (p.type === 'sparkle') {
                        this.drawSparkle(this.ctx, p.size);
                    } else {
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    this.ctx.restore();
                }

                // 2. วาดพลุกระดาษพาสเทลตอนฉากจบ
                if (this.isCelebrationMode) {
                    for (let i = 0; i < this.confettiParticles.length; i++) {
                        const c = this.confettiParticles[i];
                        c.wobble += 0.04;
                        c.x += c.vx + Math.sin(c.wobble) * 0.35;
                        c.y += c.vy;
                        c.rotation += c.rotationSpeed;

                        if (c.y > this.canvas.height + 20) {
                            this.confettiParticles[i] = this.createConfettiItem(false);
                            continue;
                        }

                        this.ctx.save();
                        this.ctx.translate(c.x, c.y);
                        this.ctx.rotate(c.rotation);
                        this.ctx.globalAlpha = c.alpha;
                        this.ctx.fillStyle = c.color;
                        this.ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
                        this.ctx.restore();
                    }
                }

                requestAnimationFrame(() => this.loop());
            }
        }

        /**
         * ตัวควบคุมหลักของแอปพลิเคชัน
         */
        document.addEventListener('DOMContentLoaded', () => {
            const cakeDisplay = document.getElementById('cake-display');
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');
            const endingScreen = document.getElementById('ending-screen');
            const replayBtn = document.getElementById('replay-btn');
            const audioToggle = document.getElementById('audio-toggle');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const canvas = document.getElementById('celebration-canvas');
            const bgMusicEl = document.getElementById('bg-music');

            const musicPlayer = new Mp3BackgroundPlayer(bgMusicEl);
            const cuteBg = new CuteBackgroundEffect(canvas);

            let sequenceTimeouts = [];
            let hasStarted = false;

            function clearAllTimers() {
                sequenceTimeouts.forEach(id => clearTimeout(id));
                sequenceTimeouts = [];
            }

            // คำนวณเวลาค้างหน้าจอตามความยาวข้อความ
            function getReadingDuration(text) {
                const baseTime = 2850;
                const extraPerChar = 48;
                return Math.min(4300, Math.max(3100, baseTime + text.length * extraPerChar));
            }

            // เริ่มเล่นลำดับข้อความทีละบรรทัด
            function playMessageSequence(index = 0) {
                if (index >= MESSAGES.length) {
                    showEndingScreen();
                    return;
                }

                const currentMessage = MESSAGES[index];
                const holdDuration = getReadingDuration(currentMessage);
                const fadeTransitionTime = 1100;

                messageText.classList.remove('show', 'hide');
                messageText.textContent = currentMessage;

                void messageText.offsetWidth;

                messageText.classList.add('show');

                const fadeOutTimer = setTimeout(() => {
                    messageText.classList.remove('show');
                    messageText.classList.add('hide');

                    const nextTimer = setTimeout(() => {
                        playMessageSequence(index + 1);
                    }, fadeTransitionTime + 200);

                    sequenceTimeouts.push(nextTimer);
                }, fadeTransitionTime + holdDuration);

                sequenceTimeouts.push(fadeOutTimer);
            }

            // แสดงหน้าจอปิดท้ายพร้อมเค้กขนาดใหญ่เด่นชัดและพลุกระดาษพาสเทล
            function showEndingScreen() {
                messageBox.style.display = 'none';
                cakeDisplay.classList.remove('compact');
                endingScreen.classList.add('active');

                cuteBg.startCelebration();

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        endingScreen.classList.add('visible');
                    });
                });
            }

            // เริ่มต้นประสบการณ์ทั้งหมดเมื่อกด "แตะเพื่อเริ่ม"
            function startExperience() {
                if (hasStarted) return;
                hasStarted = true;

                musicPlayer.start();
                audioToggle.classList.add('visible');

                startScreen.classList.add('hidden');
                // ปรับขนาดเค้กให้กะทัดรัดพอดีด้านบนกล่องข้อความ
                cakeDisplay.classList.add('compact');

                setTimeout(() => {
                    startScreen.style.display = 'none';
                    messageBox.style.display = 'flex';
                    playMessageSequence(0);
                }, 700);
            }

            // เล่นซ้ำตั้งแต่ข้อความแรก
            function replayExperience() {
                clearAllTimers();
                cuteBg.stopCelebration();
                musicPlayer.ensurePlaying();

                endingScreen.classList.remove('visible');
                cakeDisplay.classList.add('compact');

                setTimeout(() => {
                    endingScreen.classList.remove('active');
                    messageBox.style.display = 'flex';
                    playMessageSequence(0);
                }, 400);
            }

            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startExperience();
            });

            startScreen.addEventListener('click', () => {
                startExperience();
            });

            replayBtn.addEventListener('click', () => {
                replayExperience();
            });

            audioToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const muted = musicPlayer.toggleMute();
                if (muted) {
                    iconSoundOn.style.display = 'none';
                    iconSoundOff.style.display = 'block';
                } else {
                    iconSoundOn.style.display = 'block';
                    iconSoundOff.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
