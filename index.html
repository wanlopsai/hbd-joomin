<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สุขสันต์วันเกิดนะน้องจูมิน 🎂🎉</title>
  
  <!-- โหลดฟอนต์ Mali จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mali', cursive, sans-serif !important;
    }

    body {
      background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 50%, #fff1e6 100%);
      color: #5c4033;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* พื้นหลังลายจุด Polka Dot เล็กๆ ละมุนตา */
    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(#ffb3c6 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      opacity: 0.35;
      z-index: -2;
    }

    /* ตกแต่งหัวใจและดาวลอยเบาๆ พื้นหลัง */
    .floating-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      font-size: 20px;
      animation: floatUp 8s linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* ปุ่มเสียงเพลงมุมขวาบน */
    #sound-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #ffb3c6;
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
      z-index: 100;
      display: none;
      transition: all 0.2s ease;
    }
    #sound-toggle:hover {
      background: #ffb3c6;
      color: #fff;
    }

    /* หน้าแรก (Start Screen) */
    #start-screen {
      text-align: center;
      padding: 20px;
      z-index: 10;
      max-width: 400px;
    }

    .cake-icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.8rem;
      color: #d81159;
      margin-bottom: 24px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .start-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(255, 117, 140, 0.6);
    }

    /* ส่วนแสดงข้อความ (Story Container) */
    #story-container {
      display: none;
      text-align: center;
      padding: 30px 20px;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      animation: fadeIn 0.8s ease;
    }

    .story-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border: 2px solid #ffccd5;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(216, 89, 126, 0.12);
      position: relative;
    }

    .story-card .mini-cake {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
    }

    #message-box {
      font-size: 1.5rem;
      color: #4a3530;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      word-break: break-word;
    }

    #message-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* หน้าจบ (End Screen) */
    #end-screen {
      display: none;
      text-align: center;
      padding: 30px;
      z-index: 10;
      max-width: 450px;
      animation: fadeIn 1s ease;
    }

    #end-screen h2 {
      font-size: 1.9rem;
      color: #d81159;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    #end-screen p {
      font-size: 1.2rem;
      color: #6c584c;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .replay-btn {
      background: linear-gradient(135deg, #8ac926 0%, #52b788 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(82, 183, 136, 0.4);
      transition: transform 0.2s;
    }

    .replay-btn:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- แหล่งเสียงเพลงจาก GitHub -->
  <audio id="bg-music" loop preload="auto">
    <source src="every_year.mp3" type="audio/mp3">
    <source src="https://raw.githubusercontent.com/wanlopsai/hbd-joomin/main/every_year.mp3" type="audio/mp3">
  </audio>

  <!-- ปุ่มเปิด/ปิดเสียงมุมขวาบน -->
  <button id="sound-toggle" onclick="toggleSound()">🔊 เปิดเพลง</button>

  <!-- พื้นหลังลอยเบาๆ -->
  <div class="floating-bg" id="floatingBg"></div>

  <!-- หน้าแรก: แตะเพื่อเริ่ม -->
  <div id="start-screen">
    <div class="cake-icon">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <path d="M20 70 L80 70 L75 90 L25 90 Z" fill="#ffb3c6"/>
        <path d="M15 70 C15 65 85 65 85 70 L85 73 C85 78 15 78 15 73 Z" fill="#ff758c"/>
        <path d="M30 50 L70 50 C75 50 78 55 75 60 L25 60 C22 55 25 50 30 50 Z" fill="#fff"/>
        <path d="M35 30 L65 30 C70 30 72 35 70 40 L30 40 C28 35 30 30 35 30 Z" fill="#ffccd5"/>
        <rect x="48" y="12" width="4" height="20" fill="#ffd166"/>
        <ellipse cx="50" cy="10" rx="4" ry="7" fill="#ff9f1c" />
      </svg>
    </div>
    <h1>สุขสันต์วันเกิดนะน้องจูมิน 💖</h1>
    <button class="start-btn" onclick="startExperience()">แตะเพื่อเริ่ม ✨</button>
  </div>

  <!-- หน้าแสดงข้อความทีละบรรทัด -->
  <div id="story-container">
    <div class="story-card">
      <div class="mini-cake">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M20 70 L80 70 L75 90 L25 90 Z" fill="#ffb3c6"/>
          <path d="M15 70 C15 65 85 65 85 70 L85 73 C85 78 15 78 15 73 Z" fill="#ff758c"/>
          <path d="M30 50 L70 50 C75 50 78 55 75 60 L25 60 C22 55 25 50 30 50 Z" fill="#fff"/>
          <rect x="48" y="12" width="4" height="20" fill="#ffd166"/>
          <ellipse cx="50" cy="10" rx="4" ry="7" fill="#ff9f1c" />
        </svg>
      </div>
      <div id="message-box">กำลังโหลด...</div>
    </div>
  </div>

  <!-- หน้าจอปิดท้าย -->
  <div id="end-screen">
    <h2>สุขสันต์วันเกิด 17 ปีนะน้องจูมิน 🎂🎉💖✨</h2>
    <p>ขอให้ทุกวันเต็มไปด้วยรอยยิ้มและความสุขนะเด็กน้อย ✨</p>
    <button class="replay-btn" onclick="restartExperience()">ดูอีกครั้ง 🔄</button>
  </div>

  <script>
    // รายการข้อความทั้ง 13 ข้อความ
    const messages = [
      "วันนี้เป็นวันที่พิเศษเนอะ 😊",
      "วันอะไรจำได้มั้ยเอ๋ย 🤔",
      "วันเกิดน้องจูมินไง 🎂",
      "สุขสันต์วันเกิดนะ 🎉",
      "อะไรที่ทำให้รู้สึกแย่ 🌧️",
      "หวังว่าตัวเล็กจะผ่านมันไปได้นะ 💪",
      "มีความสุขให้มากๆ 🥰",
      "แล้วก็ยิ้มให้เยอะๆ 😄",
      "เพราะว่าหนูเหมาะกับรอยยิ้มที่สุดแล้ว 💖",
      "ชานมวันนี้กินหมดมั้ยนะ 🧋",
      "ไม่ว่าจะเกิดอะไรขึ้น พี่จะคอยอยู่เคียงข้างหนูเอง 🤍✨",
      "แล้วก็อย่าลืมไปหาหมอด้วยนะ ไอเด็กดื้อ 👨‍⚕️",
      "สุขสันต์วันเกิด 17 ปีนะคะ น้องจูมิน 🎂🎉💖✨"
    ];

    let currentIndex = 0;
    const music = document.getElementById('bg-music');
    const soundToggle = document.getElementById('sound-toggle');
    const startScreen = document.getElementById('start-screen');
    const storyContainer = document.getElementById('story-container');
    const endScreen = document.getElementById('end-screen');
    const messageBox = document.getElementById('message-box');

    // สร้างไอคอนลอยเบาๆ ในพื้นหลัง
    const floatingBg = document.getElementById('floatingBg');
    const symbols = ['💖', '✨', '🎂', '🎈', '⭐', '🌸', '🎁'];
    for (let i = 0; i < 18; i++) {
      let div = document.createElement('div');
      div.className = 'float-item';
      div.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      div.style.left = Math.random() * 100 + 'vw';
      div.style.animationDuration = (6 + Math.random() * 6) + 's';
      div.style.animationDelay = (Math.random() * 5) + 's';
      floatingBg.appendChild(div);
    }

    function startExperience() {
      startScreen.style.display = 'none';
      storyContainer.style.display = 'block';
      soundToggle.style.display = 'block';

      // เล่นเพลง MP3
      music.volume = 0.7;
      music.play().then(() => {
        soundToggle.innerText = '🔊 ปิดเพลง';
      }).catch(err => {
        console.log("Autoplay blocked:", err);
        soundToggle.innerText = '🔇 เปิดเพลง';
      });

      currentIndex = 0;
      showNextMessage();
    }

    function showNextMessage() {
      if (currentIndex < messages.length) {
        messageBox.classList.remove('show');
        
        setTimeout(() => {
          messageBox.innerText = messages[currentIndex];
          messageBox.classList.add('show');
          
          // คำนวณเวลาแสดงผลตามความยาวข้อความ (อย่างน้อย 3.2 วินาที)
          let displayTime = Math.max(3200, messages[currentIndex].length * 160);
          
          currentIndex++;
          setTimeout(showNextMessage, displayTime);
        }, 400);
      } else {
        // จบข้อความทั้งหมด ไปหน้า End Screen
        setTimeout(() => {
          storyContainer.style.display = 'none';
          endScreen.style.display = 'block';
        }, 1200);
      }
    }

    function toggleSound() {
      if (music.paused) {
        music.play();
        soundToggle.innerText = '🔊 ปิดเพลง';
      } else {
        music.pause();
        soundToggle.innerText = '🔇 เปิดเพลง';
      }
    }

    function restartExperience() {
      endScreen.style.display = 'none';
      currentIndex = 0;
      storyContainer.style.display = 'block';
      showNextMessage();
    }
  </script>
</body>
</html>
